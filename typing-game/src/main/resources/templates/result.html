<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Typing Game - 결과</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">
    <div class="title-bar">
        <h1>RESULT</h1>
    </div>
    <p class="info">PLAYER&nbsp;&nbsp;<strong th:text="${nickname}"></strong></p>
    <p class="info">소요 시간&nbsp;&nbsp;<strong th:text="${duration}"></strong> ms</p>
    <p class="info">정확 입력 문자 수&nbsp;&nbsp;<strong th:text="${correctChars}"></strong></p>

    <h2>전체 순위</h2>
    <table>
        <thead>
            <tr>
                <th>순위</th>
                <th>닉네임</th>
                <th>정확 문자</th>
                <th>시간 (ms)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="player, iter : ${rankings}"
                th:classappend="${player.nickname == nickname} ? 'my-row'">
                <td th:text="${iter.index + 1}"></td>
                <td th:text="${player.nickname}"></td>
                <td th:text="${player.correctChars}"></td>
                <td th:text="${player.durationMillis}"></td>
            </tr>
        </tbody>
    </table>

    <a href="/typing-game/" class="back-link">[ 다시 입장하기 ]</a>
</div>
</body>
</html>
